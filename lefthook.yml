# Git hooks for kong, managed by lefthook (pinned in ./bin).
# Install/refresh with: make hooks
# Bypass once with: LEFTHOOK=0 git commit ...   or   git commit --no-verify

pre-commit:
  parallel: false
  jobs:
    - name: format
      glob: "*.go"
      run: bin/golangci-lint fmt {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.go"
      run: bin/golangci-lint run

    - name: test
      glob: "*.go"
      run: go test ./...

pre-push:
  parallel: false
  jobs:
    - name: test-race
      run: go test -race ./...

    - name: release-check
      run: make release-check
