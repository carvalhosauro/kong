name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="kong_${VERSION}_${GOOS}_${GOARCH}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/${OUT}/kong" ./cmd/kong
          tar -czf "dist/${OUT}.tar.gz" -C "dist/${OUT}" kong"
          sha256sum "dist/${OUT}.tar.gz" > "dist/${OUT}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kong-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
